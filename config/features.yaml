# Feature configuration for B-ALL outcome prediction
# Edit this file to control which features enter each model family.
# Scripts read this via yaml::read_yaml() in R/00_config.R.

patient_id: patient_id

# Cohort filters applied in 03_qc_and_merge.R.
# Restricting to dx_year >= 2010 limits heterogeneity from older
# (pre-MRD-driven, pre-dex/HD-MTX-optimized) protocol eras.
# require_eoi=TRUE drops induction failures/deaths from the EOI-anchored
# analytic cohort; these patients are summarized in a side table.
cohort_filters:
  min_dx_year: 2010
  max_dx_year: 2025
  require_eoi: true

outcomes:
  # All survival outcomes use END OF INDUCTION as the time origin (landmark).
  # Patients who do not reach EOI (induction failure / induction death) are
  # excluded from the EOI-anchored analyses and described separately in
  # Table 1 + a competing-risks supplement.
  dfs:
    type: survival
    time_col: dfs_time_months          # months from EOI
    event_col: dfs_event               # 1 = relapse OR 2nd malignancy OR death any cause
    cause_col: dfs_cause               # informational: relapse / smn / death / censored
  os:
    type: survival
    time_col: os_eoi_time_months       # months from EOI
    event_col: os_eoi_event            # 1 = death any cause
  # Relapse kept as a complementary binary view (yes/no at last follow-up).
  # Useful as a secondary because it ignores time and is easier to interpret
  # for clinicians; primary clean answer comes from DFS.
  relapse:
    type: binary
    event_col: relapse_event           # 0/1 ever-relapsed

# Horizons for time-dependent metrics (months)
horizons_months: [12, 36, 60]

# Strata for MRD-stratified models. Build one model per stratum
# AND an overall model that includes MRD as a covariate.
mrd_strata:
  column: mrd_eoi_category          # neg / low_pos / high_pos
  levels: [neg, low_pos, high_pos]

# Clinical / demographic
clinical:
  - age_at_dx_years
  - sex
  - race_ethnicity
  - wbc_dx                          # log-transformed in 05
  - cns_status                      # CNS1/2/3
  - bmi_z                           # age-sex-normalized z-score
  - down_syndrome
  - clinical_trial_enrolled
  - treatment_type
  - protocol_arm                    # specific arm if known (free string)
  - treatment_era                   # derived from dx_year if arm unknown
  - nci_risk                        # SR/HR by NCI age+WBC
  - dx_year

# Disease biology
cytogenetics:
  - cyto_subtype                    # ETV6-RUNX1, hyperdiploid, KMT2A-r, BCR-ABL1, Ph-like, iAMP21, hypodiploid, T-ALL, other
  - ikzf1_status                    # wt / del / ikzf1plus
  - crlf2_rearr
  # Binary biology flags (0/1). Add as ascertainment expands.
  - ph_positive                     # BCR::ABL1
  - ph_like                         # Ph-like (kinase signature +)
  - kmt2a_rearr
  - etv6_runx1
  - tcf3_pbx1
  - hyperdiploid_high               # >50 chromosomes
  - hypodiploid_low                 # <44 chromosomes
  - iamp21
  - dux4_rearr
  - mef2d_rearr
  - zfn384_rearr
  - paxbike_alt                     # PAX5alt / PAX5 P80R lesions
  - tp53_alt                        # mutation or del
  - ikzf1_plus_flag                 # IKZF1 del + (CDKN2A/B, PAX5, PAR1) del without ERG del
  - cdkn2ab_del
  - jak_pathway_alt                 # JAK1/2/3, IL7R, EPOR
  - ras_pathway_alt                 # KRAS/NRAS/PTPN11/FLT3/NF1

# MRD
mrd:
  - mrd_eoi_continuous              # log10-transformed in 05 (floor at LoD)
  - mrd_eoi_category
  - mrd_eoc_continuous              # end of consolidation if available
  - day8_pb_blasts
  - day15_marrow_blasts

# Ancestry & SDOH
ancestry_sdoh:
  - global_ancestry_eur
  - global_ancestry_afr
  - global_ancestry_eas
  - global_ancestry_amr
  - global_ancestry_sas
  - adi_national_decile
  - adi_state_decile
  - insurance_payer

# Risk alleles + local ancestry dosage at each locus.
# For each allele below, expect a column <allele_id>_dosage (0/1/2)
# AND a column <allele_id>_la_<ancestry>_dose (0/1/2) for each ancestry.
risk_alleles:
  - id: ARID5B_rs7089424
    locus: 10q21.2
    ancestries: [eur, afr, amr, eas]
  - id: IKZF1_rs4132601
    locus: 7p12.2
    ancestries: [eur, afr, amr, eas]
  - id: GATA3_rs3824662
    locus: 10p14
    ancestries: [eur, afr, amr, eas]
  - id: CDKN2A_rs3731217
    locus: 9p21.3
    ancestries: [eur, afr, amr, eas]
  - id: PIP4K2A_rs7088318
    locus: 10p12.2
    ancestries: [eur, afr, amr, eas]

# Omics blocks. Top-K selected per outcome inside the inner CV loop
# (see R/05_feature_engineering.R). Never select on the full dataset.
omics:
  bulk_rna:
    file: data/processed/bulk_rna_vst.rds
    top_k: 50
    screen: cox_univariate          # cox_univariate | logistic_univariate | limma
  methylation_tumor:
    file: data/processed/meth_tumor_mvals.rds
    top_k: 50
    screen: cox_univariate
  metabolomics:
    file: data/processed/metabolomics_norm.rds
    top_k: 30
    screen: cox_univariate
  methylation_germline:
    file: data/processed/meth_germline_mvals.rds
    top_k: 30
    screen: cox_univariate
    optional: true                  # skipped if file missing

# Continuous variables to fit with restricted cubic splines in baseline Cox / GLM
spline_vars:
  - age_at_dx_years
  - wbc_dx_log10
  - mrd_eoi_log10
  - bmi_z
  - adi_national_decile

# Pre-specified clinical cut points (used in stratified tables and the
# "clinical" reference model, NOT for trimming continuous variables in ML models).
clinical_cutpoints:
  age_at_dx_years: [1, 10, 16]
  wbc_dx: [50]                      # x10^9/L; >=50 = NCI HR
  mrd_eoi_percent: [0.01, 0.1, 1.0]
  adi_national_decile: [3, 7]       # tertile-ish

# Per-outcome overrides. Start identical (core feature set defined above),
# then refine independently as you learn what matters per outcome.
# Each entry may contain:
#   include_extra:  features added on top of the core set
#   exclude:        features dropped from the core set for this outcome
#   omics_top_k:    override top_k by omics block, per outcome
# Leave empty to inherit the core set unchanged.
per_outcome:
  dfs:
    include_extra: []
    exclude: []
    omics_top_k: {}
  os:
    include_extra: []
    exclude: []
    omics_top_k: {}
  relapse:
    include_extra: []
    exclude: []
    omics_top_k: {}

# Maxstat sensitivity scan controls (exploratory only)
maxstat:
  enabled: true
  bootstrap_reps: 1000
  fdr_method: BH
